name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  kotlin-tests:
    name: Kotlin tests (iOS simulator)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Guard: the Gradle scaffold lands in plan Task 2. Until then this step
      # is a no-op so CI stays green. DELETE the guard (keep only the gradlew
      # line) as part of Task 2 so tests hard-fail from then on.
      - name: Run shared-module tests
        run: |
          if [ -f settings.gradle.kts ]; then
            ./gradlew :shared:iosSimulatorArm64Test --no-daemon
          else
            echo "Gradle scaffold not present yet (pre-Task-2) — skipping tests."
          fi
